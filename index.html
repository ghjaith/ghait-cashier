<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام مطابقة الصناديق</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.hidden{display:none!important}

.page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 8px 30px #0002;
}

h1{
    text-align:center;
    margin:0 0 8px;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:14px;
}

input,textarea{
    width:100%;
    padding:13px;
    margin-top:7px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    outline:none;
}

textarea{
    min-height:90px;
}

button{
    border:0;
    border-radius:9px;
    padding:13px 18px;
    font-size:16px;
    cursor:pointer;
}

.login-btn{
    width:100%;
    margin-top:18px;
    background:#111827;
    color:white;
}

.message{
    padding:12px;
    border-radius:9px;
    margin-top:15px;
    background:#f3f4f6;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.success{
    background:#dcfce7;
    color:#166534;
}

#adminPage{
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
}

.header{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 20px #0001;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.header h2{
    margin:0;
}

.header small{
    color:#6b7280;
}

.logout{
    background:#dc2626;
    color:white;
}

.card{
    background:white;
    margin-top:20px;
    padding:22px;
    border-radius:15px;
    box-shadow:0 5px 20px #0001;
}

.card h2{
    margin-top:0;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.stat{
    background:white;
    padding:22px;
    border-radius:15px;
    box-shadow:0 5px 20px #0001;
}

.stat-title{
    color:#6b7280;
}

.stat-number{
    font-size:30px;
    font-weight:bold;
    margin-top:8px;
}

.add-btn{
    background:#15803d;
    color:white;
    width:100%;
    margin-top:10px;
}

.employee{
    border:1px solid #e5e7eb;
    padding:15px;
    border-radius:10px;
    margin-top:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.badge{
    padding:5px 10px;
    border-radius:20px;
    font-size:13px;
}

.active{
    background:#dcfce7;
    color:#166534;
}

.inactive{
    background:#fee2e2;
    color:#991b1b;
}

.disable-btn{
    background:#dc2626;
    color:white;
}

.enable-btn{
    background:#15803d;
    color:white;
}

.refresh-btn{
    background:#e5e7eb;
    margin-bottom:10px;
}

footer{
    text-align:center;
    padding:25px;
    color:#777;
}

@media(max-width:600px){
    #adminPage{
        padding:12px;
    }

    .card{
        padding:17px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage" class="page">

    <div class="login-box">

        <h1>نظام مطابقة الصناديق</h1>

        <div class="subtitle">
            تسجيل الدخول
        </div>

        <div id="loginMessage"></div>

        <label>اسم المستخدم</label>

        <input
            id="username"
            type="email"
            placeholder="اسم المستخدم"
        >

        <label>كلمة المرور</label>

        <input
            id="password"
            type="password"
            placeholder="كلمة المرور"
        >

        <button
            id="loginBtn"
            class="login-btn"
        >
            تسجيل الدخول
        </button>

    </div>

</div>


<!-- ADMIN -->

<div id="adminPage" class="hidden">

<div class="container">

    <div class="header">

        <div>
            <h2>نظام مطابقة الصناديق</h2>
            <small id="adminWelcome"></small>
        </div>

        <button
            id="logoutBtn"
            class="logout"
        >
            تسجيل الخروج
        </button>

    </div>


    <div class="grid">

        <div class="stat">
            <div class="stat-title">
                عدد الموظفين
            </div>

            <div
                id="employeeCount"
                class="stat-number"
            >
                0
            </div>
        </div>


        <div class="stat">
            <div class="stat-title">
                الشفتات
            </div>

            <div
                id="shiftCount"
                class="stat-number"
            >
                0
            </div>
        </div>


        <div class="stat">
            <div class="stat-title">
                الشفتات المفتوحة
            </div>

            <div
                id="openShiftCount"
                class="stat-number"
            >
                0
            </div>
        </div>

    </div>


    <!-- إضافة موظف -->

    <div class="card">

        <h2>إضافة موظف جديد</h2>

        <div id="addMessage"></div>

        <label>اسم الموظف</label>

        <input
            id="newName"
            type="text"
            placeholder="مثال: محمد"
        >

        <label>اسم المستخدم / البريد الإلكتروني</label>

        <input
            id="newUsername"
            type="email"
            placeholder="employee@gmail.com"
        >

        <label>كلمة المرور</label>

        <input
            id="newPassword"
            type="password"
            placeholder="6 أحرف على الأقل"
        >

        <button
            id="addEmployeeBtn"
            class="add-btn"
        >
            إضافة الموظف
        </button>

    </div>


    <!-- قائمة الموظفين -->

    <div class="card">

        <h2>الموظفين</h2>

        <button
            id="refreshEmployees"
            class="refresh-btn"
        >
            تحديث القائمة
        </button>

        <div id="employeesList">
            جاري التحميل...
        </div>

    </div>


    <!-- الشفتات -->

    <div class="card">

        <h2>الشفتات</h2>

        <div id="shiftsList">
            جاري التحميل...
        </div>

    </div>

</div>

<footer>
07710621453
</footer>

</div>


<script>

const SUPABASE_URL =
"https://paylauzgicnocexukpcg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Tcq8m6WDJWycpoPxFZObWQ_bkMYwPSv";

const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentUser = null;
let currentEmployee = null;


/* ================= رسالة ================= */

function message(id,text,type="message"){

    document.getElementById(id).innerHTML =
    `<div class="${type}">${text}</div>`;

}


/* ================= تسجيل الدخول ================= */

document
.getElementById("loginBtn")
.onclick = login;


async function login(){

    const username =
    document.getElementById("username")
    .value
    .trim();

    const password =
    document.getElementById("password")
    .value;


    if(!username || !password){

        message(
            "loginMessage",
            "أدخل اسم المستخدم وكلمة المرور",
            "error"
        );

        return;
    }


    const btn =
    document.getElementById("loginBtn");

    btn.disabled = true;

    btn.textContent =
    "جاري تسجيل الدخول...";


    try{

        const result =
        await db.auth.signInWithPassword({

            email:username,

            password:password

        });


        if(result.error){

            message(
                "loginMessage",
                result.error.message,
                "error"
            );

            return;
        }


        currentUser =
        result.data.user;


        const employeeResult =
        await db
        .from("employees")
        .select("*")
        .eq(
            "auth_user_id",
            currentUser.id
        )
        .maybeSingle();


        if(employeeResult.error){

            message(
                "loginMessage",
                "خطأ بقراءة بيانات الحساب: "
                + employeeResult.error.message,
                "error"
            );

            return;
        }


        if(!employeeResult.data){

            message(
                "loginMessage",
                "الحساب غير مرتبط بموظف.",
                "error"
            );

            return;
        }


        currentEmployee =
        employeeResult.data;


        if(currentEmployee.active !== true){

            message(
                "loginMessage",
                "الحساب غير فعال.",
                "error"
            );

            await db.auth.signOut();

            return;
        }


        if(currentEmployee.role === "admin"){

            showAdmin();

        }else{

            message(
                "loginMessage",
                "حساب الموظف جاهز، سيتم إضافة واجهة الشفتات بالخطوة التالية.",
                "success"
            );

        }


    }catch(error){

        message(
            "loginMessage",
            "حدث خطأ: " + error.message,
            "error"
        );

    }finally{

        btn.disabled = false;

        btn.textContent =
        "تسجيل الدخول";

    }

}


/* ================= لوحة المدير ================= */

async function showAdmin(){

    document
    .getElementById("loginPage")
    .classList.add("hidden");


    document
    .getElementById("adminPage")
    .classList.remove("hidden");


    document
    .getElementById("adminWelcome")
    .textContent =
    "مرحباً " + currentEmployee.name;


    await loadEmployees();

    await loadShifts();

}


/* ================= الموظفين ================= */

async function loadEmployees(){

    const box =
    document.getElementById("employeesList");

    box.innerHTML =
    "جاري تحميل الموظفين...";


    const result =
    await db
    .from("employees")
    .select(
        "id,name,username,role,active,created_at"
    )
    .order(
        "created_at",
        {ascending:false}
    );


    if(result.error){

        box.innerHTML =
        `<div class="error">
        ${result.error.message}
        </div>`;

        return;
    }


    const employees =
    result.data || [];


    document
    .getElementById("employeeCount")
    .textContent =
    employees.length;


    if(employees.length === 0){

        box.innerHTML =
        "لا يوجد موظفين.";

        return;
    }


    box.innerHTML =
    employees.map(employee => {

        const status =
        employee.active
        ? `<span class="badge active">فعال</span>`
        : `<span class="badge inactive">غير فعال</span>`;


        const button =
        employee.role === "admin"
        ? ""
        :
        employee.active

        ? `
        <button
            class="disable-btn"
            onclick="changeEmployeeStatus('${employee.id}',false)"
        >
            تعطيل
        </button>
        `

        :

        `
        <button
            class="enable-btn"
            onclick="changeEmployeeStatus('${employee.id}',true)"
        >
            تفعيل
        </button>
        `;


        return `

        <div class="employee">

            <div>

                <strong>
                    ${escapeHtml(employee.name)}
                </strong>

                <br>

                ${escapeHtml(employee.username)}

                <br><br>

                ${employee.role === "admin"
                    ? "مدير"
                    : "موظف"}

                &nbsp;

                ${status}

            </div>

            <div>
                ${button}
            </div>

        </div>

        `;

    }).join("");

}


/* ================= تفعيل وتعطيل ================= */

async function changeEmployeeStatus(id,status){

    if(!confirm(
        status
        ? "هل تريد تفعيل الموظف؟"
        : "هل تريد تعطيل الموظف؟"
    )){

        return;
    }


    const result =
    await db
    .from("employees")
    .update({
        active:status
    })
    .eq("id",id);


    if(result.error){

        alert(
            "حدث خطأ: "
            + result.error.message
        );

        return;
    }


    await loadEmployees();

}


/* ================= إضافة موظف ================= */

document
.getElementById("addEmployeeBtn")
.onclick =
addEmployee;


async function addEmployee(){

    const name =
    document.getElementById("newName")
    .value
    .trim();

    const username =
    document.getElementById("newUsername")
    .value
    .trim();

    const password =
    document.getElementById("newPassword")
    .value;


    if(!name || !username || !password){

        message(
            "addMessage",
            "املأ جميع الحقول.",
            "error"
        );

        return;
    }


    if(password.length < 6){

        message(
            "addMessage",
            "كلمة المرور يجب أن تكون 6 أحرف على الأقل.",
            "error"
        );

        return;
    }


    const btn =
    document.getElementById("addEmployeeBtn");


    btn.disabled = true;

    btn.textContent =
    "جاري إنشاء الموظف...";


    try{

        /*
        نأخذ جلسة المدير الحالية
        */

        const sessionResult =
        await db.auth.getSession();


        const session =
        sessionResult.data.session;


        if(!session){

            message(
                "addMessage",
                "انتهت جلسة المدير. سجل الدخول من جديد.",
                "error"
            );

            return;
        }


        /*
        إرسال الطلب إلى Edge Function
        */

        const response =
        await fetch(
            SUPABASE_URL +
            "/functions/v1/create-employee",
            {

                method:"POST",

                headers:{

                    "Content-Type":
                    "application/json",

                    "Authorization":
                    "Bearer " +
                    session.access_token

                },

                body:JSON.stringify({

                    name:name,

                    username:username,

                    password:password

                })

            }
        );


        const data =
        await response.json();


        if(!response.ok){

            message(
                "addMessage",
                data.error ||
                "فشل إنشاء الموظف",
                "error"
            );

            return;
        }


        if(data.error){

            message(
                "addMessage",
                data.error,
                "error"
            );

            return;
        }


        message(
            "addMessage",
            "تم إنشاء الموظف بنجاح ✅",
            "success"
        );


        document
        .getElementById("newName")
        .value = "";

        document
        .getElementById("newUsername")
        .value = "";

        document
        .getElementById("newPassword")
        .value = "";


        await loadEmployees();


    }catch(error){

        message(
            "addMessage",
            "حدث خطأ: " + error.message,
            "error"
        );

    }finally{

        btn.disabled = false;

        btn.textContent =
        "إضافة الموظف";

    }

}


/* ================= الشفتات ================= */

async function loadShifts(){

    const box =
    document.getElementById("shiftsList");

    box.innerHTML =
    "جاري تحميل الشفتات...";


    const result =
    await db
    .from("shifts")
    .select("*")
    .order(
        "start_date",
        {ascending:false}
    )
    .limit(100);


    if(result.error){

        box.innerHTML =
        `<div class="error">
        ${result.error.message}
        </div>`;

        return;
    }


    const shifts =
    result.data || [];


    document
    .getElementById("shiftCount")
    .textContent =
    shifts.length;


    const open =
    shifts.filter(
        x => x.status === "open"
    ).length;


    document
    .getElementById("openShiftCount")
    .textContent =
    open;


    if(shifts.length === 0){

        box.innerHTML =
        "لا توجد شفتات حتى الآن.";

        return;
    }


    box.innerHTML =
    shifts.map(shift => {

        const status =
        shift.status === "open"
        ? "🟢 مفتوح"
        : "✅ منتهي";


        return `

        <div class="employee">

            <div>

                <strong>
                    ${status}
                </strong>

                <br>

                الإيراد الابتدائي:
                ${Number(
                    shift.starting_cash || 0
                ).toLocaleString()} USD

                <br>

                وقت البدء:
                ${formatDate(
                    shift.start_date
                )}

            </div>

        </div>

        `;

    }).join("");

}


/* ================= تحديث ================= */

document
.getElementById("refreshEmployees")
.onclick =
async function(){

    await loadEmployees();

    await loadShifts();

};


/* ================= خروج ================= */

document
.getElementById("logoutBtn")
.onclick =
async function(){

    await db.auth.signOut();

    currentUser = null;

    currentEmployee = null;


    document
    .getElementById("adminPage")
    .classList.add("hidden");


    document
    .getElementById("loginPage")
    .classList.remove("hidden");


    document
    .getElementById("username")
    .value = "";

    document
    .getElementById("password")
    .value = "";

};


/* ================= أدوات ================= */

function escapeHtml(value){

    return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function formatDate(value){

    if(!value){
        return "-";
    }

    return new Date(value)
    .toLocaleString("ar-IQ");

}

</script>

</body>
</html>
