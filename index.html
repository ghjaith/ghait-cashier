<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نظام مطابقة الصناديق</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.container{
    width:94%;
    max-width:1100px;
    margin:30px auto;
}

.card{
    background:#fff;
    border-radius:16px;
    padding:22px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.login-box{
    max-width:420px;
    margin:70px auto;
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    margin:0 0 8px;
    font-size:25px;
}

.logo p{
    margin:0;
    color:#6b7280;
}

input,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    margin-top:7px;
    margin-bottom:14px;
    outline:none;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input:focus,
textarea:focus{
    border-color:#111827;
}

label{
    font-weight:bold;
    display:block;
}

button{
    border:0;
    border-radius:9px;
    padding:13px 18px;
    font-size:16px;
}

.btn{
    background:#111827;
    color:white;
    width:100%;
}

.btn:hover{
    opacity:.9;
}

.btn-green{
    background:#15803d;
    color:white;
}

.btn-red{
    background:#dc2626;
    color:white;
}

.btn-gray{
    background:#e5e7eb;
    color:#111827;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.header h1{
    margin:0;
}

.user-info{
    color:#6b7280;
    margin-top:7px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:15px;
}

.stat{
    background:#f9fafb;
    padding:20px;
    border-radius:12px;
}

.stat strong{
    display:block;
    font-size:28px;
    margin-top:8px;
}

.hidden{
    display:none !important;
}

.message{
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
    background:#f3f4f6;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.employee-row{
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:15px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    font-size:13px;
}

.active{
    background:#dcfce7;
    color:#166534;
}

.inactive{
    background:#fee2e2;
    color:#991b1b;
}

.section-title{
    margin-top:0;
    border-bottom:1px solid #eee;
    padding-bottom:12px;
}

footer{
    text-align:center;
    color:#777;
    padding:25px;
}

@media(max-width:600px){

    .container{
        width:94%;
        margin:15px auto;
    }

    .card{
        padding:17px;
    }

    .header{
        align-items:flex-start;
    }

}

</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

</div>

<div class="container">

    <div class="card">

        <div class="header">

            <div>
                <h1>لوحة المدير</h1>
                <div id="adminName" class="user-info"></div>
            </div>

            <button

        </div>

    </div>


    <!-- الإحصائيات -->

    <div class="grid">

        <div class="card stat">
            الموظفين
            <strong id="employeeCount">0</strong>
        </div>

        <div class="card stat">
            الشفتات
            <strong id="shiftCount">0</strong>
        </div>

        <div class="card stat">

    </div>


    <!-- إضافة موظف -->

    <div class="card">

        <label>اسم الموظف</label>

    <!-- الموظفين -->

</div>

<div id="employeePage" class="hidden">

<div class="container">

    <div class="card">

        <div class="header">

            <div>
                <h1>نظام مطابقة الصناديق</h1>
                <div id="employeeName" class="user-info"></div>

            <button

    <!-- بدء الشفت -->

    <div

<script>

const SUPABASE_URL =
"https://paylauzgicnocexukpcg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Tcq8m6WDJWycpoPxFZObWQ_bkMYwPSv";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentUser = null;
let currentEmployee = null;
let currentShift = null;


/* ================= أدوات ================= */

function showMessage(elementId, text, type="message"){

    const element =
        document.getElementById(elementId);

    element.innerHTML =
        `<div class="${type}">${text}</div>`;
}


function hideAllPages(){

    document
        .getElementById("loginPage")
        .classList.add("hidden");

    document
        .getElementById("adminPage")
        .classList.add("hidden");

    document
        .getElementById("employeePage")
        .classList.add("hidden");
}


/* ================= تسجيل الدخول ================= */

document
.getElementById("loginButton")
.addEventListener("click", login);


async function login(){

    const username =
        document
        .getElementById("loginUsername")
        .value
        .trim();

    const password =
        document
        .getElementById("loginPassword")
        .value;

    if(!username || !password){

        showMessage(
            "loginMessage",
            "أدخل اسم المستخدم وكلمة المرور",
            "error"
        );

        return;
    }

    showMessage(
        "loginMessage",
        "جاري تسجيل الدخول..."
    );

    try{

        const {
            data,
            error
        } =
        await db.auth.signInWithPassword({

            email:username,

            password:password

        });


        if(error){

            showMessage(
                "loginMessage",
                "خطأ في تسجيل الدخول: "
                + error.message,
                "error"
            );

            return;
        }


        currentUser = data.user;


        await loadEmployee();


    }catch(error){

        showMessage(
            "loginMessage",
            "حدث خطأ: " + error.message,
            "error"
        );

    }

}


/* ================= تحميل الموظف ================= */

async function loadEmployee(){

    try{

        const {
            data,
            error
        } =
        await db
        .from("employees")
        .select("*")
        .eq("auth_user_id", currentUser.id)
        .single();


        if(error){

            showMessage(
                "loginMessage",
                "تم تسجيل الدخول لكن لم يتم العثور على حساب الموظف: "
                + error.message,
                "error"
            );

            return;
        }


        if(!data){

            showMessage(
                "loginMessage",
                "لم يتم العثور على بيانات الموظف",
                "error"
            );

            return;
        }


        if(data.active !== true){

            showMessage(
                "loginMessage",
                "هذا الحساب غير فعال",
                "error"
            );

            await db.auth.signOut();

            return;
        }


        currentEmployee = data;


        if(data.role === "admin"){

            showAdmin();

        }else{

            showEmployee();

        }

    }catch(error){

        showMessage(
            "loginMessage",
            "خطأ: " + error.message,
            "error"
        );

    }

}


/* ================= المدير ================= */

async function showAdmin(){

    hideAllPages();

    document
        .getElementById("adminPage")
        .classList.remove("hidden");

    document
        .getElementById("adminName")
        .textContent =
        "المدير: " + currentEmployee.name;

    await loadEmployees();

    await loadAllShifts();

}


/* ================= تحميل الموظفين ================= */

async function loadEmployees(){

    const list =
        document.getElementById("employeesList");

    list.innerHTML = "جاري التحميل...";


    const {
        data,
        error
    } =
    await db
    .from("employees")
    .select("*")
    .order("created_at", {
        ascending:false
    });


    if(error){

        list.innerHTML =
            `<div class="error">
                ${error.message}
            </div>`;

        return;
    }


    document
        .getElementById("employeeCount")
        .textContent =
        data.length;


    if(data.length === 0){

        list.innerHTML =
            "لا يوجد موظفين";

        return;
    }


    list.innerHTML =
        data.map(employee => {

            const status =
                employee.active
                ? `<span class="badge active">فعال</span>`
                : `<span class="badge inactive">غير فعال</span>`;

            return `
                <div class="employee-row">

                    <div>

                        <strong>
                            ${escapeHtml(employee.name)}
                        </strong>

                        <br>

                        ${escapeHtml(employee.username)}

                        <br>

                        ${status}

                    </div>

                </div>
            `;

        }).join("");

}


/* ================= إضافة موظف ================= */

document
.getElementById("addEmployeeButton")
.addEventListener(
    "click",
    addEmployee
);


async function addEmployee(){

    const name =
        document
        .getElementById("employeeName")
        .value
        .trim();

    const username =
        document
        .getElementById("employeeUsername")
        .value
        .trim();

    const password =
        document
        .getElementById("employeePassword")
        .value;


    if(!name || !username || !password){

        showMessage(
            "addEmployeeMessage",
            "املأ جميع الحقول",
            "error"
        );

        return;
    }


    if(password.length < 6){

        showMessage(
            "addEmployeeMessage",
            "كلمة المرور يجب أن تكون 6 أحرف على الأقل",
            "error"
        );

        return;
    }


    showMessage(
        "addEmployeeMessage",
        "جاري إنشاء الموظف..."
    );


    try{

        const {
            data,
            error
        } =
        await db.functions.invoke(
            "create-employee",
            {
                body:{
                    name:name,
                    username:username,
                    password:password
                }
            }
        );


        if(error){

            showMessage(
                "addEmployeeMessage",
                "خطأ: " + error.message,
                "error"
            );

            return;
        }


        if(data && data.error){

            showMessage(
                "addEmployeeMessage",
                data.error,
                "error"
            );

            return;
        }


        showMessage(
            "addEmployeeMessage",
            "تم إنشاء الموظف بنجاح ✅",
            "success"
        );


        document
        .getElementById("employeeName")
        .value = "";

        document
        .getElementById("employeeUsername")
        .value = "";

        document
        .getElementById("employeePassword")
        .value = "";


        await loadEmployees();


    }catch(error){

        showMessage(
            "addEmployeeMessage",
            "حدث خطأ: " + error.message,
            "error"
        );

    }

}


/* ================= الشفتات للمدير ================= */

async function loadAllShifts(){

    const list =
        document.getElementById("shiftsList");

    list.innerHTML = "جاري التحميل...";


    const {
        data,
        error
    } =
    await db
    .from("shifts")
    .select("*")
    .order("start_date", {
        ascending:false
    })
    .limit(50);


    if(error){

        list.innerHTML =
            `<div class="error">
                ${error.message}
            </div>`;

        return;
    }


    document
        .getElementById("shiftCount")
        .textContent =
        data.length;


    const open =
        data.filter(
            x => x.status === "open"
        ).length;


    document
        .getElementById("openShiftCount")
        .textContent =
        open;


    if(data.length === 0){

        list.innerHTML =
            "لا توجد شفتات حالياً";

        return;
    }


    list.innerHTML =
        data.map(shift => {

            return `
                <div class="employee-row">

                    <div>

                        <strong>
                            ${shift.status === "open"
                                ? "🟢 مفتوح"
                                : "✅ منتهي"}
                        </strong>

                        <br>

                        الإيراد الابتدائي:
                        ${Number(shift.starting_cash || 0).toFixed(2)}

                        <br>

                        وقت البدء:
                        ${formatDate(shift.start_date)}

                    </div>

                </div>
            `;

        }).join("");

}


/* ================= الموظف ================= */

async function showEmployee(){

    hideAllPages();

    document
        .getElementById("employeePage")
        .classList.remove("hidden");


    document
        .getElementById("employeeName")
        .textContent =
        "الموظف: " + currentEmployee.name;


    await loadCurrentShift();

}


/* ================= تحميل الشفت الحالي ================= */

async function loadCurrentShift(){

    const {
        data,
        error
    } =
    await db
    .from("shifts")
    .select("*")
    .eq("employee_id", currentEmployee.id)
    .eq("status", "open")
    .order("start_date", {
        ascending:false
    })
    .limit(1);


    if(error){

        showMessage(
            "startMessage",
            error.message,
            "error"
        );

        return;
    }


    if(data && data.length > 0){

        currentShift = data[0];

        document
        .getElementById("startShiftCard")
        .classList.add("hidden");

        document
        .getElementById("endShiftCard")
        .classList.remove("hidden");

    }else{

        currentShift = null;

        document
        .getElementById("startShiftCard")
        .classList.remove("hidden");

        document
        .getElementById("endShiftCard")
        .classList.add("hidden");

    }

}


/* ================= بدء الشفت ================= */

document
.getElementById("startShiftButton")
.addEventListener(
    "click",
    startShift
);


async function startShift(){

    const amount =
        Number(
            document
            .getElementById("startingCash")
            .value
        );


    if(amount < 0 || isNaN(amount)){

        showMessage(
            "startMessage",
            "أدخل الإيراد الابتدائي بشكل صحيح",
            "error"
        );

        return;
    }


    showMessage(
        "startMessage",
        "جاري حفظ الشفت..."
    );


    const {
        data,
        error
    } =
    await db
    .from("shifts")
    .insert({

        employee_id:
            currentEmployee.id,

        starting_cash:
            amount,

        status:
            "open"

    })
    .select()
    .single();


    if(error){

        showMessa
