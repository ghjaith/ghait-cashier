<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام مطابقة الصناديق</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,.1);
      text-align: center;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>نظام مطابقة الصناديق</h2>

  <input
    id="username"
    type="email"
    placeholder="اسم المستخدم"
  >

  <input
    id="password"
    type="password"
    placeholder="كلمة المرور"
  >

  <button onclick="testLogin()">
    تسجيل الدخول
  </button>

  <div id="result"></div>

</div>

<script>
function testLogin() {

  alert("الجافاسكربت يعمل");

  document.getElementById("result").innerHTML =
    "✅ الزر والجافاسكربت يعملان بشكل صحيح";
}
</script>

</body>
</html>
