<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نظام مطابقة الصناديق</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:420px;
    background:white;
    padding:28px;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.10);
}

h1{
    text-align:center;
    margin:0 0 8px;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:14px;
}

input{
    width:100%;
    padding:14px;
    margin-top:7px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#111827;
}

button{
    width:100%;
    padding:14px;
    margin-top:18px;
    border:0;
    border-radius:9px;
    background:#111827;
    color:white;
    font-size:17px;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:9px;
    text-align:center;
    background:#f3f4f6;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.success{
    background:#dcfce7;
    color:#166534;
}

#dashboard{
    display:none;
    width:100%;
    min-height:100vh;
    padding:20px;
}

.dashboard-box{
    max-width:900px;
    margin:20px auto;
}

.header{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.header button{
    width:auto;
    margin:0;
    background:#dc2626;
}

.card{
    background:white;
    padding:22px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    margin-top:20px;
}

.card h2{
    margin-top:0;
}

.info{
    line-height:2;
    font-size:17px;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage" class="page">

    <div class="box">

        <h1>نظام مطابقة الصناديق</h1>

        <div class="subtitle">
            تسجيل الدخول
        </div>

        <div id="message"></div>

        <label>اسم المستخدم</label>

        <input
            id="username"
            type="email"
            placeholder="أدخل اسم المستخدم"
            autocomplete="username"
        >

        <label>كلمة المرور</label>

        <input
            id="password"
            type="password"
            placeholder="أدخل كلمة المرور"
            autocomplete="current-password"
        >

        <button id="loginBtn">
            تسجيل الدخول
        </button>

    </div>

</div>


<!-- DASHBOARD -->

<div id="dashboard">

    <div class="dashboard-box">

        <div class="header">

            <div>
                <strong id="welcome"></strong>
                <br>
                <span id="role"></span>
            </div>

            <button id="logoutBtn">
                تسجيل الخروج
            </button>

        </div>


        <div class="card">

            <h2>لوحة التحكم</h2>

            <div id="employeeInfo" class="info">
                جاري تحميل البيانات...
            </div>

        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
"https://paylauzgicnocexukpcg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Tcq8m6WDJWycpoPxFZObWQ_bkMYwPSv";


const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const loginPage =
document.getElementById("loginPage");

const dashboard =
document.getElementById("dashboard");

const message =
document.getElementById("message");

const loginBtn =
document.getElementById("loginBtn");


function showMessage(text,type="message"){

    message.innerHTML =
    `<div class="${type}">${text}</div>`;

}


/* تسجيل الدخول */

loginBtn.onclick = async function(){

    const username =
    document.getElementById("username")
    .value
    .trim();

    const password =
    document.getElementById("password")
    .value;


    if(!username || !password){

        showMessage(
            "أدخل اسم المستخدم وكلمة المرور",
            "error"
        );

        return;
    }


    loginBtn.disabled = true;

    loginBtn.textContent =
    "جاري تسجيل الدخول...";


    showMessage(
        "جاري الاتصال..."
    );


    try{

        const result =
        await db.auth.signInWithPassword({

            email:username,

            password:password

        });


        if(result.error){

            showMessage(
                "خطأ: " + result.error.message,
                "error"
            );

            loginBtn.disabled = false;

            loginBtn.textContent =
            "تسجيل الدخول";

            return;
        }


        const user =
        result.data.user;


        if(!user){

            showMessage(
                "لم يتم الحصول على بيانات الحساب",
                "error"
            );

            loginBtn.disabled = false;

            loginBtn.textContent =
            "تسجيل الدخول";

            return;
        }


        showMessage(
            "تم تسجيل الدخول، جاري تحميل الحساب..."
        );


        /*
          جلب حساب الموظف
        */

        const employeeResult =
        await db
        .from("employees")
        .select(
            "id,name,username,role,active,auth_user_id"
        )
        .eq(
            "auth_user_id",
            user.id
        )
        .maybeSingle();


        if(employeeResult.error){

            showMessage(
                "تم الدخول لكن حدث خطأ بتحميل بيانات الحساب: "
                + employeeResult.error.message,
                "error"
            );

            loginBtn.disabled = false;

            loginBtn.textContent =
            "تسجيل الدخول";

            return;
        }


        const employee =
        employeeResult.data;


        if(!employee){

            showMessage(
                "الحساب موجود لكن لا توجد بيانات موظف مرتبطة به.",
                "error"
            );

            loginBtn.disabled = false;

            loginBtn.textContent =
            "تسجيل الدخول";

            return;
        }


        if(employee.active !== true){

            showMessage(
                "هذا الحساب غير فعال.",
                "error"
            );

            await db.auth.signOut();

            loginBtn.disabled = false;

            loginBtn.textContent =
            "تسجيل الدخول";

            return;
        }


        /*
          إظهار لوحة التحكم
        */

        loginPage.style.display =
        "none";

        dashboard.style.display =
        "block";


        document.getElementById("welcome")
        .textContent =
        "مرحباً " + employee.name;


        document.getElementById("role")
        .textContent =
        employee.role === "admin"
        ? "المدير"
        : "الموظف";


        document.getElementById("employeeInfo")
        .innerHTML = `

            <div>
                <strong>الاسم:</strong>
                ${escapeHtml(employee.name)}
            </div>

            <div>
                <strong>اسم المستخدم:</strong>
                ${escapeHtml(employee.username)}
            </div>

            <div>
                <strong>الصلاحية:</strong>
                ${employee.role === "admin"
                    ? "مدير"
                    : "موظف"}
            </div>

            <div>
                <strong>الحالة:</strong>
                فعال
            </div>

            <hr>

            <div>
                تسجيل الدخول ناجح ✅
            </div>

        `;


    }catch(error){

        showMessage(
            "حدث خطأ: " + error.message,
            "error"
        );

    }


    loginBtn.disabled = false;

    loginBtn.textContent =
    "تسجيل الدخول";

};


/* تسجيل الخروج */

document
.getElementById("logoutBtn")
.onclick = async function(){

    await db.auth.signOut();

    dashboard.style.display =
    "none";

    loginPage.style.display =
    "flex";

    document.getElementById("username")
    .value = "";

    document.getElementById("password")
    .value = "";

    showMessage(
        "تم تسجيل الخروج"
    );

};


/* حماية عرض النصوص */

function escapeHtml(value){

    return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
</html>
