```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>نظام مطابقة الصناديق</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #1e3a8a);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .login-box {
      width: 92%;
      max-width: 420px;
      background: rgba(255,255,255,0.97);
      color: #111827;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      margin: 0;
      color: #1e3a8a;
      font-size: 30px;
    }

    .logo p {
      color: #6b7280;
      margin-top: 8px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      color: #dc2626;
      min-height: 20px;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      font-size: 13px;
      color: #9ca3af;
      direction: ltr;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      <h1>نظام مطابقة الصناديق</h1>
      <p>نظام إدارة ومطابقة الصناديق والورديات</p>
    </div>

    <form id="loginForm">

      <label>اسم المستخدم</label>
      <input
        type="text"
        id="username"
        placeholder="أدخل اسم المستخدم"
        required
      >

      <label>كلمة المرور</label>
      <input
        type="password"
        id="password"
        placeholder="أدخل كلمة المرور"
        required
      >

      <button type="submit">
        تسجيل الدخول
      </button>

      <div class="message" id="message"></div>

    </form>

    <div class="footer">
      07710621453
    </div>

  </div>

</body>
</html>
