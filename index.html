<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام مطابقة الصناديق</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #1e3a8a);
      display: flex;

    }

    .login-box {

      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,.3);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      margin: 0;
      color: #1e3a8a;
      font-size: 29px;
    }

    .logo p {
      color: #6b7280;
      margin-top: 10px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
      color: #111827;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      min-height: 22px;
      margin-top: 15px;
      text-align: center;
      color: #dc2626;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #9ca3af;
      font-size: 13px;
      direction: ltr;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      <h1>نظام مطابقة الصناديق</h1>
      <p>نظام إدارة ومطابقة الصناديق والورديات</p>
    </div>

    <form id="loginForm">

      <label for="username">اسم المستخدم</label>
      <input
        type="email"
        id="username"
        placeholder="أدخل البريد الإلكتروني"
        autocomplete="username"
        required
      >

      <label for="password">كلمة المرور</label>
      <input
        type="password"
        id="password"
        placeholder="أدخل كلمة المرور"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        تسجيل الدخول
      </button>

      <div class="message" id="message"></div>

    </form>

    <div class="footer">
      07710621453
    </div>

  </div>

  <script type="module">

    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://paylauzgicnocexukpcg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Tcq8m6WDJWycpoPxFZObWQ_bkMYwPSv";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      message.textContent = "";
      button.disabled = true;
      button.textContent = "جاري تسجيل الدخول...";

      const email =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value;

      const { data, error } =
        await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {

        message.textContent =
          "بيانات الدخول غير صحيحة";

        button.disabled = false;
        button.textContent = "تسجيل الدخول";

        console.error(error);

        return;
      }

      const user = data.user;

      const { data: employee, error: employeeError } =
        await supabase
          .from("employees")
          .select("id,name,username,role,active")
          .eq("auth_user_id", user.id)
          .single();

      if (employeeError || !employee) {

        await supabase.auth.signOut();

        message.textContent =
          "الحساب غير مرتبط بموظف في النظام";

        button.disabled = false;
        button.textContent = "تسجيل الدخول";

        return;
      }

      if (!employee.active) {

        await supabase.auth.signOut();

        message.textContent =
          "هذا الحساب غير فعال";

        button.disabled = false;
        button.textContent = "تسجيل الدخول";

        return;
      }

      localStorage.setItem(
        "ghait_employee",
        JSON.stringify(employee)
      );

      document.body.innerHTML = `
        <div style="
          min-height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          background:#111827;
          color:white;
          font-family:Arial,Tahoma,sans-serif;
          text-align:center;
          padding:20px;
        ">
          <div>
            <h1>تم تسجيل الدخول بنجاح ✅</h1>
            <h2>أهلاً ${employee.name}</h2>
            <p>الصلاحية: ${employee.role}</p>
            <p>هذه الصفحة مؤقتة، وسنضع لوحة النظام الحقيقية هنا.</p>
          </div>
        </div>
      `;

    });

  </script>

</body>
</html>
