<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>نظام مطابقة الصناديق</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#f3f4f6;
color:#111827;
}

.hidden{display:none!important}

.page{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.login{
width:100%;
max-width:420px;
background:white;
padding:30px;
border-radius:18px;
box-shadow:0 8px 30px #0002;
}

h1{text-align:center;margin:0 0 8px}
.sub{text-align:center;color:#777;margin-bottom:25px}

label{
display:block;
font-weight:bold;
margin-top:14px;
}

input{
width:100%;
padding:14px;
margin-top:7px;
border:1px solid #ddd;
border-radius:9px;
font-size:16px;
}

button{
border:0;
border-radius:9px;
padding:13px 18px;
font-size:16px;
cursor:pointer;
}

.loginBtn{
width:100%;
margin-top:20px;
background:#111827;
color:white;
}

.msg{
padding:12px;
border-radius:9px;
margin-top:15px;
background:#f3f4f6;
}

.err{
background:#fee2e2;
color:#991b1b;
}

.ok{
background:#dcfce7;
color:#166534;
}

#admin{
display:none;
min-height:100vh;
padding:15px;
}

.container{
max-width:1000px;
margin:auto;
}

.header{
background:white;
padding:20px;
border-radius:15px;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
box-shadow:0 5px 20px #0001;
}

.logout{
background:#dc2626;
color:white;
}

.card{
background:white;
padding:22px;
border-radius:15px;
margin-top:20px;
box-shadow:0 5px 20px #0001;
}

.add{
background:#15803d;
color:white;
width:100%;
margin-top:10px;
}

.employee{
border:1px solid #ddd;
padding:15px;
border-radius:10px;
margin-top:10px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.badge{
padding:5px 10px;
border-radius:20px;
font-size:13px;
}

.active{
background:#dcfce7;
color:#166534;
}

.inactive{
background:#fee2e2;
color:#991b1b;
}

@media(max-width:600px){
.employee{
flex-direction:column;
align-items:flex-start;
}
}
</style>
</head>

<body>


<!-- LOGIN -->

<div id="loginPage" class="page">

<div class="login">

<h1>نظام مطابقة الصناديق</h1>

<div class="sub">
تسجيل الدخول
</div>

<div id="loginMsg"></div>

<label>اسم المستخدم</label>

<input
id="username"
type="email"
placeholder="اسم المستخدم"
>

<label>كلمة المرور</label>

<input
id="password"
type="password"
placeholder="كلمة المرور"
>

<button
id="loginBtn"
class="loginBtn"
>
تسجيل الدخول
</button>

</div>

</div>


<!-- ADMIN -->

<div id="admin">

<div class="container">

<div class="header">

<div>

<strong id="welcome"></strong>

<br>

<span>صلاحية المدير</span>

</div>

<button
id="logout"
class="logout"
>
تسجيل الخروج
</button>

</div>


<!-- ADD EMPLOYEE -->

<div class="card">

<h2>إضافة موظف</h2>

<div id="addMsg"></div>

<label>اسم الموظف</label>

<input
id="empName"
type="text"
placeholder="مثال: محمد"
>

<label>اسم المستخدم</label>

<input
id="empUsername"
type="email"
placeholder="employee@gmail.com"
>

<label>كلمة المرور</label>

<input
id="empPassword"
type="password"
placeholder="6 أحرف على الأقل"
>

<button
id="addBtn"
class="add"
>
إضافة الموظف
</button>

</div>


<!-- EMPLOYEES -->

<div class="card">

<h2>الموظفين</h2>

<div id="employees">
جاري التحميل...
</div>

</div>

</div>

</div>


<script>

const URL =
"https://paylauzgicnocexukpcg.supabase.co";

const KEY =
"sb_publishable_Tcq8m6WDJWycpoPxFZObWQ_bkMYwPSv";


const db =
supabase.createClient(
URL,
KEY
);


let employee;


/* ================= LOGIN ================= */

document
.getElementById("loginBtn")
.onclick =
login;


async function login(){

const username =
document
.getElementById("username")
.value
.trim();

const password =
document
.getElementById("password")
.value;


if(!username || !password){

show(
"loginMsg",
"أدخل اسم المستخدم وكلمة المرور",
true
);

return;
}


const btn =
document.getElementById("loginBtn");

btn.disabled=true;

btn.textContent=
"جاري الدخول...";


try{

const result =
await db.auth.signInWithPassword({

email:username,

password:password

});


if(result.error){

show(
"loginMsg",
result.error.message,
true
);

return;
}


const user =
result.data.user;


const emp =
await db
.from("employees")
.select("*")
.eq(
"auth_user_id",
user.id
)
.maybeSingle();


if(emp.error){

show(
"loginMsg",
emp.error.message,
true
);

return;
}


if(!emp.data){

show(
"loginMsg",
"لا توجد بيانات موظف لهذا الحساب",
true
);

return;
}


employee =
emp.data;


if(employee.active !== true){

show(
"loginMsg",
"الحساب غير فعال",
true
);

await db.auth.signOut();

return;
}


if(employee.role !== "admin"){

show(
"loginMsg",
"هذا الحساب ليس مديراً",
true
);

return;
}


document
.getElementById("loginPage")
.style.display="none";


document
.getElementById("admin")
.style.display="block";


document
.getElementById("welcome")
.textContent=
"مرحباً " + employee.name;


await loadEmployees();


}catch(e){

show(
"loginMsg",
e.message,
true
);

}finally{

btn.disabled=false;

btn.textContent=
"تسجيل الدخول";

}

}


/* ================= ADD EMPLOYEE ================= */

document
.getElementById("addBtn")
.onclick =
addEmployee;


async function addEmployee(){

const name =
document
.getElementById("empName")
.value
.trim();

const username =
document
.getElementById("empUsername")
.value
.trim();

const password =
document
.getElementById("empPassword")
.value;


if(!name || !username || !password){

show(
"addMsg",
"املأ جميع الحقول",
true
);

return;
}


if(password.length < 6){

show(
"addMsg",
"كلمة المرور يجب أن تكون 6 أحرف على الأقل",
true
);

return;
}


const btn =
document.getElementById("addBtn");


btn.disabled=true;

btn.textContent=
"جاري الإنشاء...";


try{


/*
الحصول على جلسة المدير
*/

const sessionResult =
await db.auth.getSession();


const session =
sessionResult.data.session;


if(!session){

show(
"addMsg",
"انتهت جلسة المدير، سجل الدخول من جديد",
true
);

return;
}


/*
إرسال الطلب للـ Edge Function
*/

const response =
await fetch(

URL +
"/functions/v1/create-employee",

{

method:"POST",

headers:{

"Content-Type":
"application/json",

"Authorization":
"Bearer " +
session.access_token

},

body:JSON.stringify({

name:name,

username:username,

password:password

})

}

);


/*
قراءة الرد
*/

const text =
await response.text();


let data;


try{

data =
JSON.parse(text);

}catch{

data = {
error:text
};

}


if(!response.ok){

show(
"addMsg",
"خطأ من الخادم: "
+
(response.status || "")
+
"<br>"
+
(data.error || "خطأ غير معروف"),
true
);

return;
}


if(data.error){

show(
"addMsg",
data.error,
true
);

return;
}


show(
"addMsg",
"تم إنشاء الموظف بنجاح ✅",
false
);


document
.getElementById("empName")
.value="";

document
.getElementById("empUsername")
.value="";

document
.getElementById("empPassword")
.value="";


await loadEmployees();


}catch(e){

show(
"addMsg",
"خطأ في الاتصال: "
+
e.message,
true
);

}finally{

btn.disabled=false;

btn.textContent=
"إضافة الموظف";

}

}


/* ================= EMPLOYEES ================= */

async function loadEmployees(){

const box =
document.getElementById("employees");

box.innerHTML=
"جاري التحميل...";


const result =
await db
.from("employees")
.select(
"id,name,username,role,active"
)
.order(
"created_at",
{ascending:false}
);


if(result.error){

box.innerHTML=
`<div class="err msg">
${result.error.message}
</div>`;

return;
}


const list =
result.data || [];


if(list.length===0){

box.innerHTML=
"لا يوجد موظفين";

return;
}


box.innerHTML =
list.map(x=>`

<div class="employee">

<div>

<strong>
${escapeHtml(x.name)}
</strong>

<br>

${escapeHtml(x.username)}

<br><br>

${x.role==="admin"
?"مدير"
:"موظف"}

&nbsp;

<span class="badge ${
x.active
?"active"
:"inactive"
}">

${x.active
?"فعال"
:"غير فعال"}

</span>

</div>

</div>

`).join("");

}


/* ================= LOGOUT ================= */

document
.getElementById("logout")
.onclick =
async function(){

await db.auth.signOut();

location.reload();

};


/* ================= HELPERS ================= */

function show(id,text,error){

document
.getElementById(id)
.innerHTML=
`
<div class="msg ${
error ? "err" : "ok"
}">
${text}
</div>
`;

}


function escapeHtml(value){

return String(value || "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

</script>

</body>
</html>
