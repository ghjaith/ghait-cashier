<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام مطابقة الصناديق</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f3f4f6;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.box{
  background:white;
  width:90%;
  max-width:400px;
  padding:25px;
  border-radius:15px;
  box-shadow:0 5px 25px #0002;
}

h2{
  text-align:center;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:8px;
  background:#111827;
  color:white;
  font-size:17px;
}

#result{
  margin-top:15px;
  text-align:center;
}
</style>
</head>

<body>

<div class="box">

<h2>نظام مطابقة الصناديق</h2>

<input id="username" type="email" placeholder="اسم المستخدم">

<input id="password" type="password" placeholder="كلمة المرور">

<button id="loginBtn">
تسجيل الدخول
</button>

<div id="result"></div>

</div>

<script>

const SUPABASE_URL =
"https://paylauzgicnocexukpcg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Tcq8m6WDJWycpoPxFZObWQ_bkMYwPSv";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

document.getElementById("loginBtn").onclick = async function(){

  const result = document.getElementById("result");

  result.innerHTML = "جاري تسجيل الدخول...";

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  if(!username || !password){

    result.innerHTML =
      "❌ أدخل اسم المستخدم وكلمة المرور";

    return;
  }

  try{

    const { data, error } =
      await db.auth.signInWithPassword({
        email: username,
        password: password
      });

    if(error){

      result.innerHTML =
        "❌ خطأ: " + error.message;

      return;
    }

    if(data.user){

      result.innerHTML =
        "✅ تم تسجيل الدخول بنجاح";

      alert("نجح تسجيل الدخول ✅");

    }

  }catch(error){

    result.innerHTML =
      "❌ حدث خطأ: " + error.message;

  }

};

</script>

</body>
</html>
